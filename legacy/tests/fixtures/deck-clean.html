<!doctype html>
<!-- Test fixture: a deck that should pass every lint check. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clean fixture</title>
<style>
:root {

.stage { width: 1920px; height: 1080px; transform: scale(var(--scale,1)); }

</div>
<div class="counter"><span id="cNow">01</span><span>/</span><span id="cTotal">01</span></div>
<script>(function(){ 'use strict'; const slides=document.querySelectorAll('.slide'); slides[0].classList.add('is-active'); })();</script>
