<!doctype html>
<!--
  Scaffold · 01-cover.html
  Archetype A — Cover (Portada).
  Compose: centered ornament above + centered title + centered subtitle + soft byline.

  Cómo usar:
    1) Reemplazá [Lección 01 — Título de la lección] con el título real.
    2) Reemplazá [Nombre del curso] con el nombre del curso/serie.
    3) Elegí un ornamento de §7 en DESIGN.md (monogram, compass, trinity, ichthys,
       alpha-omega, rule-and-dot). Pegá el <svg> dentro de .ornament.
    4) Reemplazá la línea "En el nombre del Padre…" si querés un saludo distinto;
       no la borres salvo que tengas una razón litúrgica.
    5) Cambiá el <title> del <head> y el data-screen-label al inicio.

  Reglas: 1 ornamento máximo, paleta tokenizada, 1920×1080.
-->
<html lang="es" class="look-monastic shape-landscape-16-9">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curso de Catequesis — [Lección 01]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ── Style + shape ────────────────────────────────────────────
     Default: monastic + landscape-16-9.
     To switch: edit the class on <html> above, and swap the two
     <link> tags below. Available looks: monastic, festive, typographic.
     Available shapes: landscape-16-9, portrait-3-4, square-1-1,
     ultrawide-21-9. See docs/extending-slide-craft.md. -->
<link rel="stylesheet" href="_looks/monastic.css">
<link rel="stylesheet" href="_shapes/landscape-16-9.css">

<style>
:root {
  --bg:       #F5EBD9;
  --surface:  #EFE3CC;
  --fg:       #5C1A1B;
  --muted:    #8A7560;
  --border:   #B5A285;
  --accent:   #73201D;
  --gold:     #A8915C;

  --font-display: "Cormorant Garamond", "EB Garamond", "Iowan Old Style", "Charter", Georgia, serif;
  --font-body:    "EB Garamond", "Lora", "Iowan Old Style", "Charter", Georgia, serif;
  --font-mono:    "JetBrains Mono", ui-monospace, "IBM Plex Mono", Menlo, monospace;

  --text-meta: 18px;
  --text-sm:   22px;
  --text-base: 28px;
  --text-lg:   36px;
  --text-xl:   56px;
  --text-2xl:  80px;
  --text-3xl:  112px;
  --leading-tight: 1.15;
  --leading-body:  1.45;
  --tracking-display: -0.01em;

  --space-1: 8px;  --space-2: 16px; --space-3: 24px;
  --space-4: 32px; --space-5: 48px; --space-6: 64px;
  --space-8: 96px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  width: 100vw; height: 100vh;
  display: grid; place-items: center;
  background: var(--bg);
  background-image: radial-gradient(ellipse at center, var(--bg) 0%, color-mix(in oklab, var(--bg), var(--fg) 12%) 100%);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
}

.stage {
  width: 1920px; height: 1080px;
  transform: scale(var(--scale, 1));
  transform-origin: center center;
  position: relative;
  background: var(--bg);
  background-image: radial-gradient(ellipse at center, var(--bg) 0%, color-mix(in oklab, var(--bg), var(--fg) 12%) 100%);
  flex-shrink: 0;
}

.slide {
  position: absolute; inset: 0;
  display: none; padding: 96px 140px;
  opacity: 0; transform: translateY(16px);
  transition: opacity 350ms cubic-bezier(.2,.7,.3,1), transform 350ms cubic-bezier(.2,.7,.3,1);
}
.slide.is-active { display: flex; flex-direction: column; justify-content: center; opacity: 1; transform: translateY(0); }

.counter {
  position: absolute; bottom: 32px; right: 48px;
  font-family: var(--font-mono); font-size: var(--text-meta);
  letter-spacing: 0.18em; color: var(--muted); z-index: 100;
}
.help {
  position: absolute; bottom: 32px; left: 48px;
  font-family: var(--font-mono); font-size: var(--text-meta);
  letter-spacing: 0.10em; color: var(--muted); z-index: 100;
}
.help kbd {
  display: inline-block;
  font-family: var(--font-mono); font-size: 16px;
  padding: 1px 6px; border: 1px solid var(--border);
  border-radius: 3px; background: var(--surface); color: var(--muted);
  margin: 0 1px;
}

.slide h1 {
  font-family: var(--font-display); font-weight: 600;
  font-size: var(--text-3xl); line-height: var(--leading-tight);
  letter-spacing: var(--tracking-display); color: var(--fg);
  text-align: center; margin: 0 auto var(--space-3); max-width: 18ch;
}
.slide .subtitle {
  text-align: center; font-family: var(--font-body);
  font-size: var(--text-lg); color: var(--muted); margin: 0 auto;
  max-width: 56ch;
}

.ornament {
  display: grid; place-items: center; color: var(--gold);
  position: absolute; top: 160px; left: 50%;
  transform: translateX(-50%);
}
.ornament svg { width: 200px; height: 200px; display: block; }
</style>
</head>
<body>

<div class="stage">

  <!-- EDITAR: data-screen-label — etiqueta de la lección/sección. -->
  <section class="slide is-active" data-screen-label="01 Portada">
    <!-- EDITAR: ornamento — elegí uno de DESIGN.md §7 (monogram, compass, trinity, ichthys, alpha-omega, rule-and-dot). -->
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M50 16 L50 84 M28 38 L72 38"/>
      </svg>
    </div>
    <header style="margin: auto; text-align: center;">
      <!-- EDITAR: título principal de la lección. -->
      <h1>[Lección 01 — Título de la lección]</h1>
      <!-- EDITAR: nombre del curso/serie. -->
      <p class="subtitle">Curso de Catequesis · [Nombre del curso]</p>
    </header>
    <!-- EDITAR (opcional): saludo litúrgico. Reemplazá si querés otro, no borres salvo razón litúrgica. -->
    <p style="position:absolute; bottom:96px; left:0; right:0; text-align:center;
              font-family:var(--font-display); font-style:italic; font-size:var(--text-sm);
              color:var(--muted);">
      En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.
    </p>
  </section>

</div>

<div class="counter" aria-live="polite">
  <span id="cNow">01</span><span class="counter-sep">/</span><span id="cTotal">01</span>
</div>
<div class="help" aria-hidden="true">
  <kbd>←</kbd> <kbd>→</kbd> navegar · <kbd>Inicio</kbd> <kbd>Fin</kbd> extremos
</div>

<script>
(function () {
  'use strict';
  const stage = document.querySelector('.stage');
  const slides = Array.from(stage.querySelectorAll('.slide'));
  const total = slides.length;
  const cNow = document.getElementById('cNow');
  const cTotal = document.getElementById('cTotal');
  cTotal.textContent = String(total).padStart(2, '0');

  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.setProperty('--scale', s);
  }
  window.addEventListener('resize', fit);
  fit();

  function show(i) {
    const clamped = Math.max(0, Math.min(total - 1, i));
    slides.forEach((s, j) => {
      s.classList.toggle('is-active', j === clamped);
    });
    cNow.textContent = String(clamped + 1).padStart(2, '0');
  }
  document.addEventListener('keydown', (e) => {
    const cur = slides.findIndex((s) => s.classList.contains('is-active'));
    if (cur < 0) return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case ' ': show(cur + 1); e.preventDefault(); break;
      case 'ArrowLeft':  case 'PageUp':     show(cur - 1); e.preventDefault(); break;
      case 'Home': show(0); e.preventDefault(); break;
      case 'End':  show(total - 1); e.preventDefault(); break;
    }
  });

  show(0);
})();
</script>
</body>
</html>
